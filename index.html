<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جرد بوابة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--bg:#0b132b;--card:#111c44;--sl:#1e293b;--ln:#334155;--tx:#f8fafc;--mu:#94a3b8;--g2:#4edea3;--k:16,185,129;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.6 'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif}
button,input,select,textarea{font-family:inherit}
#app{max-width:560px;margin:auto;padding:0 16px 120px}
.k-g{--k:16,185,129}.k-a{--k:245,158,11}.k-r{--k:239,68,68}.k-c{--k:6,182,212}
.tk{color:rgb(var(--k))}
.m{font-family:'JetBrains Mono',monospace;direction:ltr;display:inline-block;font-weight:700}
.i{font-family:'Material Symbols Outlined';font-size:24px;line-height:1;direction:ltr;display:inline-block;font-weight:400}
.hd{display:flex;align-items:center;gap:12px;padding:16px 0}
.lg{width:46px;height:46px;border-radius:10px;background:var(--sl);color:var(--g2);display:grid;place-items:center;box-shadow:0 0 18px -6px var(--g2)}
.t{font-size:18px}.sub{color:var(--g2);font-size:12px;font-weight:600}.ml{margin-inline-start:auto}
.card{display:block;background:var(--card);border:1px solid rgba(51,65,85,.6);border-radius:12px;padding:14px;margin-bottom:12px}
.glow{box-shadow:0 0 22px -6px rgba(var(--k),.4);border-color:rgba(var(--k),.45)}
.h{font-weight:700;font-size:16px;margin-bottom:8px}
.h2{font-weight:700;font-size:16px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
small,.mu{color:var(--mu);font-size:12px}
label{display:block;color:var(--mu);font-size:12px;margin:8px 0 4px}
input,select,textarea{width:100%;background:#0b132b;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:12px;font-size:15px;min-height:46px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g2);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.f1{flex:1}
.b{border:1px solid var(--ln);background:var(--sl);color:var(--tx);border-radius:10px;min-height:48px;padding:0 16px;font-size:15px;font-weight:600;cursor:pointer}
.b:active,.kb:active{transform:scale(.97)}
.w{width:100%;margin-top:6px}.ic{min-height:40px;padding:0 12px}
.p{background:linear-gradient(90deg,#10b981,#06b6d4);color:#04122a;border:0;font-size:17px;min-height:56px;box-shadow:0 8px 24px -8px rgba(16,185,129,.6)}
.chip{display:inline-flex;gap:4px;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:rgb(var(--k));background:rgba(var(--k),.12);border:1px solid rgba(var(--k),.3);white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid>div{background:rgba(5,13,37,.55);border-radius:10px;padding:10px}.grid small{display:block}
.big{font-size:26px}.g3{display:flex;justify-content:space-between;margin-top:8px;background:rgba(5,13,37,.55);border-radius:8px;padding:8px 10px}
.ct input{text-align:center;font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;min-height:56px}
.ct .b{width:58px;min-height:56px;font-size:26px;padding:0}
.kbs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.kb{flex:1;min-width:52px;min-height:54px;font:700 16px 'JetBrains Mono',monospace;background:var(--sl);color:var(--tx);border:1px solid var(--ln);border-bottom-width:3px;border-radius:12px;cursor:pointer}
#cash{font-size:28px;text-align:center;direction:ltr}
.clk{text-align:center;background:linear-gradient(135deg,#111c44,#0b132b);border-color:rgba(6,182,212,.3)}
#clk{font-size:46px;color:var(--g2);text-shadow:0 0 18px rgba(78,222,163,.45);display:block;margin:8px 0}
.kv{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.hb{width:100%;text-align:start;color:var(--tx);cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:space-between}
nav{position:fixed;inset:auto 0 0;display:flex;background:rgba(10,18,42,.93);backdrop-filter:blur(16px);border-top:1px solid var(--sl);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:0;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:500}
nav .on{color:var(--g2);font-weight:700}
.md{position:fixed;inset:0;background:rgba(5,13,37,.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.md .card{width:100%;max-width:360px}
.ts{position:fixed;inset:auto 16px calc(90px + env(safe-area-inset-bottom,0px));margin:auto;max-width:360px;background:var(--sl);border:1px solid var(--g2);border-radius:10px;padding:12px;text-align:center;z-index:9}
.rp{font-size:13px}.rp hr{border:0;border-top:1px solid var(--ln);margin:10px 0}
.rp table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:12px}
.rp th,.rp td{border-bottom:1px solid var(--ln);padding:5px 3px;text-align:start}.rp th{color:var(--mu)}
.sig{display:flex;justify-content:space-around;margin-top:28px;padding-top:6px;color:var(--mu)}
.paper{position:fixed;left:-10000px;top:0;width:794px;padding:32px;background:#fff;direction:rtl}.paper,.paper *{color:#000!important;background:#fff!important;border-color:#999!important;box-shadow:none!important;text-shadow:none!important}
#sp{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#13284f 0,#0b132b 55%,#050b1d 100%);display:grid;place-items:center;clip-path:circle(150% at 50% 42%);transition:clip-path .9s cubic-bezier(.7,0,.2,1);cursor:pointer;overflow:hidden}
#sp.out{clip-path:circle(0% at 50% 42%)}
.sp-c{text-align:center;padding:24px;width:100%}
.sp-l{position:relative;width:148px;height:148px;margin:0 auto 26px;display:grid;place-items:center;animation:fl 3.4s ease-in-out infinite}
.sp-l::after{content:'';position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle,rgba(78,222,163,.25),transparent 65%);animation:pu 2.2s ease-in-out infinite}
.sp-l svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:none;stroke-linecap:round;stroke-linejoin:round}
.r1{stroke:url(#gr);stroke-width:3;stroke-dasharray:430;stroke-dashoffset:430;animation:dr 1.4s .15s cubic-bezier(.6,0,.2,1) forwards;filter:drop-shadow(0 0 6px #4edea3)}
.r2{stroke:rgba(6,182,212,.55);stroke-width:1.5;stroke-dasharray:5 11;transform-box:fill-box;transform-origin:center;animation:fi .6s .7s both,rt 14s linear infinite}
.bd{fill:#10b981;stroke:0;transform-box:fill-box;transform-origin:center;animation:pop .6s 1.9s cubic-bezier(.2,1.6,.4,1) both}
.ck{stroke:#04122a;stroke-width:3.5;stroke-dasharray:30;stroke-dashoffset:30;animation:dr .5s 2.3s ease forwards}
.sp-l .i{position:relative;z-index:1;font-size:60px;color:#4edea3;filter:drop-shadow(0 0 14px rgba(78,222,163,.7));animation:pop .8s .8s cubic-bezier(.2,1.6,.4,1) both}
.sp-t{margin:0;font-size:56px;font-weight:700;line-height:1.35;display:flex;justify-content:center;gap:16px}
.sp-t span{background:linear-gradient(100deg,#f8fafc 35%,#4edea3 50%,#06b6d4 62%,#f8fafc 78%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;filter:blur(14px);transform:translateY(26px) scale(.9);animation:wd 1.1s var(--d) cubic-bezier(.2,.8,.2,1) forwards,sh 2.6s calc(var(--d) + 1s) ease-in-out infinite}
.sp-ln{height:2px;width:0;margin:12px auto 0;background:linear-gradient(90deg,transparent,#4edea3,transparent);animation:ln 1s 1.6s ease forwards}
.sp-s{margin:16px 0 0;color:#94a3b8;font-size:18px;opacity:0;transform:translateY(12px);animation:up .9s 1.9s ease forwards}
.sp-p{width:140px;height:3px;background:#1e293b;border-radius:3px;margin:34px auto 0;overflow:hidden}
.sp-p i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#06b6d4);transform-origin:right;transform:scaleX(0);animation:pg 5.8s .2s cubic-bezier(.5,0,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes rt{to{transform:rotate(360deg)}}@keyframes fi{from{opacity:0}}
@keyframes pop{from{transform:scale(0);opacity:0}}@keyframes pu{50%{opacity:.5;transform:scale(1.15)}}@keyframes fl{50%{transform:translateY(-7px)}}
@keyframes wd{to{opacity:1;filter:blur(0);transform:none}}@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes ln{to{width:190px}}@keyframes up{to{opacity:1;transform:none}}@keyframes pg{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#sp *,#sp::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
@media print{body *{visibility:hidden}#rep,#rep *{visibility:visible}#rep{position:absolute;inset:0 auto auto 0;width:100%}.rp,.rp *{color:#000!important;background:#fff!important;border-color:#999!important;box-shadow:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body><div id="app"></div><nav id="nav"></nav>
<div id="sp"><div class="sp-c"><div class="sp-l"><svg viewBox="0 0 148 148" aria-hidden="true"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4edea3"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><circle class="r1" cx="74" cy="74" r="68"/><circle class="r2" cx="74" cy="74" r="56"/><circle class="bd" cx="120" cy="122" r="15"/><path class="ck" d="M113 122l5 5 9-10"/></svg><span class="i">confirmation_number</span></div><h1 class="sp-t"><span style="--d:.9s">جرد</span><span style="--d:1.15s">بوابة</span></h1><div class="sp-ln"></div><p class="sp-s">كل حاجة متراجعة ومظبوطة.</p><div class="sp-p"><i></i></div></div></div>
<script>
const K='gate_audit_v1',$=s=>document.querySelector(s);
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const blank=()=>({emp:'',gate:S.gates[0]||'',q:{},cash:'',note:''});
function norm(){S.emp=S.emp||[];S.gates=S.gates||['بوابة 1'];S.hist=S.hist||[];S.day=S.day||null;S.cur=S.cur||blank()}
norm();let V='start',REP=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},
n=x=>(+x||0).toLocaleString('en-US'),uid=()=>Math.random().toString(36).slice(2,9),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
dp=()=>[4,5,6].includes(new Date().getDay())?75:50,
tm=t=>new Date(t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
da=t=>new Date(t).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
hj=t=>new Date(t).toLocaleDateString('ar-SA-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}),
st=d=>d>0?['زيادة','a']:d<0?['عجز','r']:['مطابق','g'],
chip=d=>{const[s,k]=st(d);return `<span class="chip k-${k}">${s}${d?` <b class=m>${n(Math.abs(d))}</b>`:''}</span>`},
sums=D=>D.audits.reduce((o,a)=>({k:o.k+1,t:o.t+a.tot,c:o.c+a.cash,r:o.r+a.req,d:o.d+a.diff}),{k:0,t:0,c:0,r:0,d:0}),
gd=s=>`<div class=grid><div><small>الجردات</small><b class="m big">${s.k}</b></div><div><small>التذاكر</small><b class="m big">${n(s.t)}</b></div><div><small>النقدية (ج.م)</small><b class="m big">${n(s.c)}</b></div><div><small>صافي الفرق</small><b class="m big tk k-${st(s.d)[1]}">${s.d>0?'+':''}${n(s.d)}</b></div></div>`;
function toast(m){const t=document.createElement('div');t.className='ts';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2300)}
function ask(msg,fn){const m=document.createElement('div');m.className='md';m.innerHTML=`<div class=card><p>${msg}</p><div class=row><button class="b p f1" id=y>تأكيد</button><button class="b f1" id=x>إلغاء</button></div></div>`;document.body.append(m);m.querySelector('#x').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{m.remove();fn()}}
const TT={start:'بدء اليوم',audit:'جرد موظف',reports:'السجلات والتقارير',settings:'الإعدادات'},IC={start:'schedule',audit:'fact_check',reports:'description',settings:'settings'};
function go(v){V=v;if(v!='reports')REP=null;render();scrollTo(0,0)}
function render(){
$('#app').innerHTML=`<div class=hd><div class=lg><span class=i>confirmation_number</span></div><div><b class=t>جرد بوابة</b><div class=sub>${TT[V]}</div></div><span class="chip ${S.day?'k-g':'k-a'} ml">${S.day?'اليوم مفتوح':'لا يوجد يوم مفتوح'}</span></div>${{start:vStart,audit:vAudit,reports:vRep,settings:vSet}[V]()}`;
$('#nav').innerHTML=Object.keys(TT).map(k=>`<button class="${k==V?'on':''}" onclick="go('${k}')"><span class=i>${IC[k]}</span>${TT[k]}</button>`).join('');
tick();if(V=='audit'&&S.day)rf()}
function tick(){const e=$('#clk');if(e)e.textContent=new Date().toLocaleTimeString('en-US',{hour12:false})}
function vStart(){const h=S.hist[0];let b;
if(!S.day)b=`<div class="card glow k-g"><div class=h>بيانات اليوم الجديد</div><div class=kv><span>سعر تذكرة الدخول اليوم</span><b class=m>${dp()} ج.م</b></div><div class=kv><span>الموظفون المسجلون</span><b class=m>${S.emp.length}</b></div><button class="b p w" onclick=startDay()>فتح يوم جديد وبدء الجرد</button><p class=mu>سيتم توثيق وقت البدء من ساعة الهاتف.</p></div>`;
else b=`<div class="card glow k-${st(sums(S.day).d)[1]}"><div class=h>إحصائيات اليوم حتى الآن</div>${gd(sums(S.day))}<button class="b p w" onclick="go('audit')">بدء جرد جديد</button></div>`;
return `<div class="card clk"><span class="chip k-c">مزامنة مباشرة مع توقيت الهاتف</span><span id=clk class=m></span><div>${da(Date.now())}</div><div class=mu>${hj(Date.now())}</div></div>${b}${h?`<div class=card><div class=h>إحصائيات اليوم السابق</div><small>${da(h.date)}</small>${gd(sums(h))}</div>`:''}`}
function startDay(){S.day={id:uid(),date:Date.now(),cats:[{id:uid(),name:'تذكرة دخول',price:dp()}],audits:[]};S.cur=blank();save();go('audit')}
function vAudit(){if(!S.day)return `<div class=card><div class=h>لا يوجد يوم مفتوح</div><p class=mu>افتح يوماً جديداً لتبدأ تسجيل الجرد.</p><button class="b p w" onclick=startDay()>فتح يوم جديد</button></div>`;
const c=S.cur,o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
return `<div class=card><div class=h>بيانات الجرد</div><label>الموظف</label><select onchange="S.cur.emp=this.value;save()"><option value="">اختر الموظف…</option>${o(S.emp,c.emp)}</select><div class=row><input id=ne placeholder="إضافة موظف جديد"><button class=b onclick=addE()>إضافة</button></div><label>البوابة</label><select onchange="S.cur.gate=this.value;save()">${o(S.gates,c.gate)}</select></div>
<div class=card><div class=h>إضافة فئة تذكرة</div><div class=row><input id=cn placeholder="مثال: باركينج"><input id=cp type=number inputmode=decimal placeholder="السعر" style="max-width:110px"></div><button class="b w" onclick=addC2()>＋ إضافة الفئة للقائمة</button></div>
${S.day.cats.map(x=>`<div class=card><div class=row><b class=f1>${esc(x.name)}</b><button class="b ic" onclick="delC('${x.id}')" aria-label="حذف"><span class=i>delete</span></button></div><div class=row><label class=f1>سعر التذكرة (ج.م)</label><input type=number inputmode=decimal value="${x.price}" style="max-width:110px" onchange="setP('${x.id}',this.value)"></div><div class="row ct"><button class=b onclick="qa('${x.id}',1)">+</button><input id=q${x.id} type=number inputmode=numeric min=0 value=0 oninput="qs('${x.id}',this.value)"><button class=b onclick="qa('${x.id}',-1)">−</button><div class=f1 style="text-align:end"><small>المبلغ</small><br><b class="m tk k-g" id=l${x.id}>0</b></div></div></div>`).join('')}
<div class="card glow k-c"><div class=h>ملخص مبيعات الجرد</div><div class=grid><div><small>إجمالي التذاكر</small><b class="m big" id=tt>0</b></div><div><small>المبلغ المطلوب (ج.م)</small><b class="m big tk k-g" id=rq>0</b></div></div></div>
<div class=card><div class=h>مطابقة الكاش الفعلي في الدرج</div><input id=cash type=number inputmode=decimal placeholder="0" value="${c.cash}" oninput="S.cur.cash=this.value;rf()"><div class=kbs>${[200,100,50,20,10,5,1].map(v=>`<button class=kb onclick=addK(${v})>+${v}</button>`).join('')}<button class=kb onclick=addK(0)>مسح</button></div><div id=st class=card></div><input placeholder="ملاحظة (اختياري)" value="${esc(c.note)}" oninput="S.cur.note=this.value;save()"></div>
<button class="b p w" onclick=closeA()>تقفيل الجرد وحفظ العملية</button>`}
function rf(){if(!S.day)return;let t=0,r=0;const c=S.cur;
S.day.cats.forEach(x=>{const q=+c.q[x.id]||0;t+=q;r+=q*x.price;const i=$('#q'+x.id);if(i&&document.activeElement!==i)i.value=q;const l=$('#l'+x.id);if(l)l.textContent=n(q*x.price)});
$('#tt').textContent=n(t);$('#rq').textContent=n(r);
const b=$('#st'),e=c.cash==='',d=(+c.cash||0)-r,[s,k]=st(d);
b.className='card glow k-'+(e?'c':k);
b.innerHTML=e?'<b>أدخل الكاش الفعلي ليظهر الفرق</b>':`<b class="tk k-${k}">${d==0?'الكاش مطابق تماماً للمبيعات المسجلة!':`${s} في الدرج بقيمة ${n(Math.abs(d))} ج.م`}</b><div class=mu>الفرق الفعلي: <span class=m>${d>0?'+':''}${n(d)}</span> ج.م</div>`;save()}
const qa=(i,d)=>{S.cur.q[i]=Math.max(0,(+S.cur.q[i]||0)+d);rf()},
qs=(i,v)=>{S.cur.q[i]=Math.max(0,parseInt(v)||0);rf()},
addK=v=>{S.cur.cash=v?(+S.cur.cash||0)+v:'';$('#cash').value=S.cur.cash;rf()},
setP=(i,v)=>{S.day.cats.find(x=>x.id==i).price=Math.max(0,+v||0);rf()},
delC=i=>ask('حذف هذه الفئة من قائمة اليوم؟',()=>{S.day.cats=S.day.cats.filter(x=>x.id!=i);delete S.cur.q[i];save();render()}),
addC2=()=>{const v=$('#cn').value.trim();if(!v)return toast('اكتب اسم الفئة');S.day.cats.push({id:uid(),name:v,price:Math.max(0,+$('#cp').value||0)});save();render()},
addE=()=>{const v=$('#ne').value.trim();if(!v)return;if(!S.emp.includes(v))S.emp.push(v);S.cur.emp=v;save();render()};
function closeA(){const c=S.cur;let t=0,r=0;S.day.cats.forEach(x=>{const q=+c.q[x.id]||0;t+=q;r+=q*x.price});
if(!c.emp)return toast('اختر الموظف أولاً');if(c.cash==='')return toast('أدخل قيمة الكاش الفعلي');if(!t&&!+c.cash)return toast('أدخل التذاكر أو الكاش');
const cash=+c.cash;S.day.audits.push({id:uid(),at:Date.now(),emp:c.emp,gate:c.gate,note:c.note,items:S.day.cats.filter(x=>c.q[x.id]>0).map(x=>({n:x.name,p:x.price,q:+c.q[x.id]})),tot:t,req:r,cash,diff:cash-r});
S.cur={...blank(),gate:c.gate};save();render();scrollTo(0,0);toast('تم حفظ الجرد')}
const aCard=(a,ed)=>`<div class=card><div class=row><b class=f1>${esc(a.emp)} <small>${esc(a.gate)}</small></b>${chip(a.diff)}${ed?`<button class="b ic" onclick="delA('${a.id}')" aria-label="حذف"><span class=i>delete</span></button>`:''}</div><div class=mu>${tm(a.at)} • ${a.items.map(i=>`${esc(i.n)} ×${i.q}`).join('، ')||'—'}</div><div class=g3><span>التذاكر <b class=m>${a.tot}</b></span><span>المطلوب <b class=m>${n(a.req)}</b></span><span>الكاش <b class=m>${n(a.cash)}</b></span></div>${a.note?`<div class=mu>ملاحظة: ${esc(a.note)}</div>`:''}</div>`,
delA=i=>ask('حذف هذا الجرد؟',()=>{S.day.audits=S.day.audits.filter(a=>a.id!=i);save();render()});
function vRep(){const D=REP?S.hist.find(h=>h.id==REP):S.day;let h='';
if(REP)h+=`<button class="b w" onclick="REP=null;render()">رجوع لليوم الجاري</button>`;
if(S.day&&!REP){const s=sums(S.day);h+=`<div class="card glow k-${s.k?st(s.d)[1]:'c'}"><div class=h>ملخص اليوم الجاري</div>${gd(s)}${s.k?`<button class="b w" onclick=closeDay()>حفظ وتقفيل اليوم نهائياً</button>`:''}</div>`}
if(D)h+=`<div class=h2>سجل عمليات الجرد <small>${D.audits.length} سجلات</small></div>${D.audits.slice().reverse().map(a=>aCard(a,D==S.day)).join('')||'<p class=mu>لا توجد جردات بعد. ابدأ من شاشة الجرد.</p>'}<div class=h2>معاينة التقرير الرسمي</div><div id=rep class=card>${rp(D)}</div><button class="b p w" onclick=pr()>تحميل وتصدير تقرير الـ PDF</button><p class=mu>سيظهر طلب تأكيد لحفظ ملف الـ PDF على جهازك.</p>`;
else h+=`<div class=card><p class=mu>لا يوجد يوم مفتوح. افتح يوماً جديداً من أول شاشة، أو اختر تقريراً من الأيام السابقة.</p></div>`;
if(S.hist.length)h+=`<div class=h2>أيام سابقة</div>${S.hist.map(x=>`<button class="card hb" onclick="REP='${x.id}';render();scrollTo(0,0)"><span><b>${da(x.date)}</b><br><small>${x.audits.length} جردات • ${n(sums(x).c)} ج.م</small></span>${chip(sums(x).d)}</button>`).join('')}`;
return h}
function rp(D){const s=sums(D),ag={};D.audits.forEach(a=>a.items.forEach(i=>{const k=i.n+'|'+i.p;(ag[k]=ag[k]||{n:i.n,p:i.p,q:0}).q+=i.q}));
const T=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
return `<div class=rp><div class=row><b class=f1 style="font-size:16px">محضر جرد وتصفية يومية</b><span class="chip ${D.closed?'k-g':'k-a'}">${D.closed?'مقفل':'مسودة'}</span></div><div class=mu>${da(D.date)} • ${hj(D.date)}${D.closed?` • أُغلق ${tm(D.closed)}`:''}</div><hr>
<div class=kv><span>عدد الجردات</span><b class=m>${s.k}</b></div><div class=kv><span>إجمالي التذاكر</span><b class=m>${n(s.t)}</b></div><div class=kv><span>المبلغ المطلوب</span><b class=m>${n(s.r)} ج.م</b></div><div class=kv><span>النقدية الفعلية</span><b class=m>${n(s.c)} ج.م</b></div><div class=kv><span>صافي الفرق</span>${chip(s.d)}</div><hr>
<b>الفئات المحصلة</b>${T(['الفئة','السعر','العدد','الإجمالي'],Object.values(ag).map(x=>[esc(x.n),n(x.p),x.q,n(x.p*x.q)]))}
<b>تفاصيل الجردات</b>${T(['الوقت','الموظف','التذاكر','المطلوب','الكاش','الفرق'],D.audits.map(a=>[tm(a.at),`${esc(a.emp)}<br><small>${esc(a.gate)}</small>`,a.tot,n(a.req),n(a.cash),(a.diff>0?'+':'')+n(a.diff)]))}
${D.audits.filter(a=>a.note).map(a=>`<div class=mu>ملاحظة (${esc(a.emp)}): ${esc(a.note)}</div>`).join('')}
<div class=sig><span>توقيع المراجع</span><span>توقيع المشرف</span></div></div>`}
async function pr(){const D=REP?S.hist.find(h=>h.id==REP):S.day;if(!D)return;let dl=null;try{dl=await claude.use('downloads')}catch(e){}
if(!dl||!window.html2canvas||!window.jspdf){try{print()}catch(e){toast('تعذر تصدير الـ PDF من هذه النافذة')}return}
toast('جاري تجهيز الملف…');const box=document.createElement('div');box.className='paper';box.innerHTML=rp(D);document.body.append(box);
try{const cv=await html2canvas(box,{scale:2,backgroundColor:'#fff'}),pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),sh=Math.floor(cv.width*ph/pw);
for(let y=0,p=0;y<cv.height;y+=sh,p++){const c=document.createElement('canvas');c.width=cv.width;c.height=Math.min(sh,cv.height-y);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);if(p)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,c.height*pw/cv.width)}
await dl.save({filename:'audit-report-'+new Date(D.date).toISOString().slice(0,10)+'.pdf',data:pdf.output('blob')});toast('تم حفظ التقرير')}
catch(e){if(!e||e.code!='declined')toast('تعذر تصدير الـ PDF')}finally{box.remove()}}
function closeDay(){ask('تقفيل اليوم نهائياً؟ لن تقدر تضيف جردات بعده.',()=>{S.day.closed=Date.now();S.hist.unshift(S.day);REP=S.day.id;S.day=null;S.cur=blank();save();render();scrollTo(0,0)})}
function vSet(){const L=(a,k)=>a.map((x,i)=>`<div class="row"><span class=f1>${esc(x)}</span><button class="b ic" onclick="del('${k}',${i})" aria-label="حذف"><span class=i>close</span></button></div>`).join('')||'<p class=mu>لا يوجد بعد.</p>';
return `<div class=card><div class=h>الموظفون</div>${L(S.emp,'emp')}<div class=row><input id=se placeholder="اسم موظف"><button class=b onclick="add('emp','se')">إضافة</button></div></div><div class=card><div class=h>البوابات</div>${L(S.gates,'gates')}<div class=row><input id=sg placeholder="اسم بوابة"><button class=b onclick="add('gates','sg')">إضافة</button></div></div><div class=card><div class=h>نسخة احتياطية</div><p class=mu>البيانات محفوظة على هذا الجهاز فقط، فخد نسخة احتياطية بشكل دوري.</p><textarea id=bk rows=4 placeholder="تظهر النسخة هنا"></textarea><div class=row><button class="b f1" onclick=bkp()>إنشاء ونسخ</button><button class="b f1" onclick=rst()>استعادة من النص</button></div><button class="b w" style="border-color:#ef4444;color:#fca5a5" onclick=wipe()>مسح كل البيانات</button></div>`}
const add=(k,i)=>{const v=$('#'+i).value.trim();if(v&&!S[k].includes(v)){S[k].push(v);save();render()}},
del=(k,i)=>{S[k].splice(i,1);save();render()},
bkp=()=>{const v=JSON.stringify(S);$('#bk').value=v;try{navigator.clipboard.writeText(v).then(()=>toast('تم النسخ'),()=>toast('انسخ النص يدوياً'))}catch(e){toast('انسخ النص يدوياً')}},
rst=()=>{let o;try{o=JSON.parse($('#bk').value)}catch(e){}if(!o||!Array.isArray(o.hist))return toast('النص غير صالح');ask('استبدال كل البيانات الحالية بالنسخة؟',()=>{S=o;norm();save();go('start')})},
wipe=()=>ask('مسح كل البيانات نهائياً؟',()=>{try{localStorage.removeItem(K)}catch(e){}S={};norm();go('start')});
render();setInterval(tick,1000);
(()=>{const s=$('#sp');if(!s)return;let d=0;const out=()=>{if(d)return;d=1;s.classList.add('out');setTimeout(()=>s.remove(),1000)};setTimeout(out,matchMedia('(prefers-reduced-motion:reduce)').matches?700:6000);s.onclick=out})();
</script></body></html>
